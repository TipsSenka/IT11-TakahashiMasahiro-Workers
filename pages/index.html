<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cloudflare Workers APIを確認するためのPages画面">
    <title>Workers API Console</title>
    <style>
        :root {
            --ink: #182230;
            --muted: #667085;
            --paper: #f7f4ed;
            --panel: #fffdf8;
            --line: #ded8ca;
            --coral: #e76145;
            --coral-dark: #ad3828;
            --teal: #087f78;
            --shadow: 0 18px 40px rgb(51 45 35 / 10%);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: var(--ink);
            background:
                linear-gradient(125deg, rgb(226 240 234 / 80%), transparent 43%),
                radial-gradient(circle at 90% 8%, #f5d8b7 0 10%, transparent 31%),
                var(--paper);
            font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
        }

        .shell { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
        header { padding: 54px 0 34px; display: flex; justify-content: space-between; gap: 24px; align-items: end; }
        .eyebrow { color: var(--teal); font-size: .76rem; font-weight: 800; letter-spacing: .16em; }
        h1 { margin: 12px 0 8px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.3rem, 6vw, 4.8rem); line-height: .95; letter-spacing: 0; }
        .lead { max-width: 560px; margin: 0; color: var(--muted); line-height: 1.8; }
        .status { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: .86rem; white-space: nowrap; }
        .status::before { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); content: ""; }
        main { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr); gap: 24px; padding-bottom: 60px; }
        .panel { border: 1px solid var(--line); background: rgb(255 253 248 / 88%); box-shadow: var(--shadow); }
        .controls { padding: 26px; }
        .panel h2 { margin: 0 0 20px; font-size: 1.15rem; }
        .endpoint-list { display: grid; gap: 10px; }
        button, input { font: inherit; }
        button { border: 1px solid var(--line); border-radius: 2px; cursor: pointer; }
        .endpoint { min-height: 58px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; background: var(--panel); color: var(--ink); text-align: left; transition: transform .2s, border-color .2s; }
        .endpoint:hover { border-color: var(--coral); transform: translateX(4px); }
        .endpoint strong { display: block; font-size: .98rem; }
        .endpoint small { color: var(--muted); }
        .method { color: var(--teal); font-size: .72rem; font-weight: 800; letter-spacing: .08em; }
        form { display: flex; gap: 10px; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); }
        input { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 2px; padding: 13px 14px; background: #fff; color: var(--ink); }
        input:focus { outline: 2px solid rgb(8 127 120 / 24%); border-color: var(--teal); }
        .primary { padding: 13px 18px; background: var(--coral); color: white; border-color: var(--coral); font-weight: 700; }
        .primary:hover { background: var(--coral-dark); }
        .result { min-height: 420px; padding: 26px; background: var(--ink); color: #eef3f0; }
        .result-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .result h2 { margin: 0; color: #fff; }
        #result-meta { color: #9eb7b2; font-size: .78rem; }
        pre { overflow: auto; min-height: 320px; margin: 0; padding: 20px; background: #101821; color: #bce5c8; font: .86rem/1.7 Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
        footer { padding: 18px 0 32px; color: var(--muted); font-size: .78rem; }
        @media (max-width: 760px) { .shell { width: min(100% - 28px, 560px); } header { padding-top: 32px; display: block; } .status { margin-top: 20px; } main { grid-template-columns: 1fr; } .result { min-height: 360px; } pre { min-height: 260px; } }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <div>
                <div class="eyebrow">CLOUDFLARE / PAGES × WORKERS</div>
                <h1>Workers<br>API Console</h1>
                <p class="lead">PagesからWorker APIへ接続し、レスポンスをその場で確認できます。各エンドポイントはJSONで応答します。</p>
            </div>
            <div class="status">API接続テスト ready</div>
        </header>

        <main>
            <section class="panel controls" aria-labelledby="controls-title">
                <h2 id="controls-title">エンドポイントを選択</h2>
                <div class="endpoint-list">
                    <button class="endpoint" data-path="/api" type="button"><span><strong>API status</strong><small>Workerの稼働状態</small></span><span class="method">GET /api</span></button>
                    <button class="endpoint" data-path="/api/course" type="button"><span><strong>Course</strong><small>学習コースの概要</small></span><span class="method">GET /api/course</span></button>
                    <button class="endpoint" data-path="/api/fortune" type="button"><span><strong>Fortune</strong><small>今日の運勢を取得</small></span><span class="method">GET /api/fortune</span></button>
                    <button class="endpoint" data-path="/api/events" type="button"><span><strong>Events</strong><small>イベント一覧</small></span><span class="method">GET /api/events</span></button>
                </div>
                <form id="hello-form">
                    <input id="name" name="name" maxlength="50" autocomplete="off" placeholder="名前を入力（例：山田）" aria-label="名前">
                    <button class="primary" type="submit">Helloを送信</button>
                </form>
            </section>

            <section class="panel result" aria-live="polite" aria-labelledby="result-title">
                <div class="result-heading"><h2 id="result-title">Response</h2><span id="result-meta">未実行</span></div>
                <pre id="result">左のボタンからAPIを選択してください。</pre>
            </section>
        </main>
        <footer>接続先: <span id="base-url"></span></footer>
    </div>

    <script>
        // 本番Worker名を変更したときは、このURLだけを更新します。
        const WORKER_BASE_URL = "https://workers-backend.nh-mt.workers.dev";
        const result = document.querySelector("#result");
        const resultMeta = document.querySelector("#result-meta");
        document.querySelector("#base-url").textContent = WORKER_BASE_URL;

        async function callApi(path) {
            result.textContent = "通信中...";
            resultMeta.textContent = path;
            try {
                const response = await fetch(`${WORKER_BASE_URL}${path}`);
                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);
                resultMeta.textContent = `${response.status} ${response.statusText} / ${path}`;
            } catch (error) {
                result.textContent = JSON.stringify({ error: "APIに接続できませんでした", detail: error.message }, null, 2);
                resultMeta.textContent = "接続エラー";
            }
        }

        document.querySelectorAll("[data-path]").forEach((button) => {
            button.addEventListener("click", () => callApi(button.dataset.path));
        });

        document.querySelector("#hello-form").addEventListener("submit", (event) => {
            event.preventDefault();
            const name = document.querySelector("#name").value.trim();
            callApi(`/api/hello?name=${encodeURIComponent(name)}`);
        });
    </script>
</body>
</html>
